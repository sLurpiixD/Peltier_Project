; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; PlatformIO — TEC Test Bench DAQ
; Target: ESP32-S3-N16R8 (16 MB Flash, 8 MB OPI PSRAM)
;
; Platform pinned to espressif32 ~6.5.0, which bundles
; arduino-esp32 v3.x. This is REQUIRED because main.cpp uses
; the v3.x pin-based ledc API (ledcAttach / ledcWrite).
; Do NOT downgrade to espressif32 5.x — that bundles v2.x,
; which uses the old ledcSetup/ledcAttachPin/channel API.
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

upload_port = COM4   ; Set to your actual port

; ------------------------------------------------------------
; HARDWARE OVERRIDES: ESP32-S3-N16R8
; ------------------------------------------------------------
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

; ------------------------------------------------------------
; SENSOR LIBRARIES
; ------------------------------------------------------------
lib_deps =
    adafruit/MAX6675 library
    adafruit/Adafruit MAX31855 library
    robtillaart/INA226
    milesburton/DallasTemperature
    paulstoffregen/OneWire

; ------------------------------------------------------------
; SERIAL MONITOR
; ------------------------------------------------------------
monitor_speed   = 115200
monitor_filters = direct